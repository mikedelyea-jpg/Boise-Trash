<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="boiseGreen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#047857" />
      <stop offset="100%" stop-color="#064e3b" />
    </linearGradient>
  </defs>
  <!-- Rounded forest emerald container -->
  <rect width="64" height="64" rx="16" fill="url(#boiseGreen)" />
  <!-- Clean bold display letter 'B' -->
  <text 
    x="32" 
    y="46" 
    fill="#ffffff" 
    font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" 
    font-weight="900" 
    font-size="38" 
    text-anchor="middle"
    letter-spacing="-1"
  >B</text>
  <!-- Subtle top highlight -->
  <circle cx="48" cy="16" r="3" fill="#34d399" opacity="0.9" />
</svg>
